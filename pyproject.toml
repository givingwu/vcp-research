[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "vcp-research"
version = "0.1.0"
description = "Causal VCP vs momentum strategy research skeleton"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.31"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]